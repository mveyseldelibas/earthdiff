<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>{{LEAFLET_CSS}}</style>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#16202a;--mute:#5b6773;--line:#dde2e8;--accent:#0b5cad;--warn-bg:#fff4e0;--warn-line:#e0a030}
@media (prefers-color-scheme:dark){:root{--bg:#0f1318;--card:#171d24;--ink:#e6ebf0;--mute:#9aa7b4;--line:#2a333d;--accent:#6aaeff;--warn-bg:#2b2412;--warn-line:#a67c1d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1200px;margin:0 auto;padding:16px}
.top{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
h1{font-size:1.5rem;margin:.2rem 0}
h2{font-size:1.15rem;margin:1.6rem 0 .6rem}
.sub{color:var(--mute);margin:0 0 12px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:12px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.card .k{font-size:.78rem;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
.card .v{font-size:1.35rem;font-weight:650}
.card .s{font-size:.8rem;color:var(--mute)}
.chip{display:inline-block;width:.8em;height:.8em;border-radius:2px;margin-right:.4em;border:1px solid rgba(0,0,0,.35)}
.warn{background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:10px;padding:10px 14px;margin:12px 0}
.warn ul{margin:.3rem 0 0 1.1rem;padding:0}
.toolbar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin:8px 0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--card);color:var(--ink);padding:6px 12px;cursor:pointer;font:inherit}
.seg button[aria-pressed=true]{background:var(--accent);color:#fff}
.seg button:disabled{opacity:.45;cursor:default}
select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:5px 8px}
label.tg{display:inline-flex;gap:.35rem;align-items:center;color:var(--mute);font-size:.9rem}
#mapbox{position:relative}
#map,#map3d{height:68vh;min-height:380px;border:1px solid var(--line);border-radius:10px;background:#cfd6dd}
#map3d{display:none}
.leaflet-container{font:inherit}
#swipe{position:absolute;top:0;bottom:0;left:50%;width:0;z-index:900;pointer-events:none}
#swipe .bar{position:absolute;top:0;bottom:0;left:-1.5px;width:3px;background:#fff;box-shadow:0 0 4px rgba(0,0,0,.6)}
#swipe .grab{position:absolute;top:0;bottom:0;left:-14px;width:28px;pointer-events:auto;cursor:ew-resize;touch-action:none}
#swipe.dragging .bar{background:#ffd400}
#swipe .knob{position:absolute;top:50%;left:-18px;width:36px;height:36px;margin-top:-18px;border-radius:50%;background:#fff;box-shadow:0 0 6px rgba(0,0,0,.6);pointer-events:none;cursor:ew-resize;display:flex;align-items:center;justify-content:center;font-size:16px;color:#333;touch-action:none}
#knobdate{position:absolute;top:calc(50% + 24px);left:0;transform:translateX(-50%);display:flex;gap:0;white-space:nowrap;pointer-events:none;font-size:.8rem;font-weight:600;box-shadow:0 1px 5px rgba(0,0,0,.5);border-radius:6px;overflow:hidden}
#knobdate span{padding:3px 8px;color:#fff}#knobdate small{font-weight:500;opacity:.85;margin-left:4px}
#knobdate .b{background:rgba(20,20,20,.82)}#knobdate .a{background:rgba(11,92,173,.92)}
.lab{position:absolute;top:10px;z-index:901;background:rgba(0,0,0,.65);color:#fff;padding:2px 8px;border-radius:6px;font-size:.8rem;pointer-events:none}
.lab.l{left:56px}.lab.r{right:10px}
#tl{display:none;align-items:center;gap:10px;margin:8px 0;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;flex-wrap:wrap}
#tl button{font:inherit;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:5px 12px;cursor:pointer;min-width:84px}
.rwrap{position:relative;flex:1;min-width:180px;padding-bottom:10px}
#tl input[type=range]{width:100%;margin:0;accent-color:var(--accent)}
#tl-date{font-weight:700;font-size:1.05rem;min-width:170px}
.badge{display:inline-block;border-radius:6px;padding:1px 8px;font-size:.78rem;font-weight:700;color:#fff;margin-left:6px;vertical-align:.1em}
.badge.before{background:#3a4450}.badge.after{background:var(--accent)}.badge.between{background:#7d5bd6}
#tl-meta{font-size:.82rem;color:var(--mute)}
#ticks{position:absolute;left:8px;right:8px;bottom:0;height:8px;pointer-events:none}
#ticks i{position:absolute;top:0;width:2px;height:8px;margin-left:-1px;background:var(--mute);border-radius:1px}
#ticks i.after{background:var(--accent)}#ticks i.between{background:#7d5bd6}
#banner{position:absolute;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);z-index:950;background:rgba(213,94,0,.95);color:#fff;padding:8px 14px;border-radius:9px;font-weight:600;font-size:.92rem;box-shadow:0 3px 12px rgba(0,0,0,.4);opacity:0;transition:opacity .4s,transform .4s;pointer-events:none;max-width:90%;text-align:center}
#banner.on{opacity:1;transform:translateX(-50%) translateY(0)}
#tlhint{position:absolute;left:56px;top:10px;z-index:901;background:rgba(0,0,0,.72);color:#fff;padding:3px 9px;border-radius:6px;font-size:.82rem;font-weight:600;pointer-events:none;display:none}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin:8px 0;font-size:.9rem}
.legend2{font-size:.85rem;color:var(--mute);margin:0 0 8px}
.dot{display:inline-block;width:.85em;height:.85em;border-radius:50%;border:2px solid #777;vertical-align:-.1em;margin:0 .25em 0 .6em}
.str-strong{font-weight:700}.str-moderate{font-weight:600}.str-weak{font-style:italic}
table{border-collapse:collapse;width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;font-size:.88rem;white-space:nowrap}
th{background:rgba(127,127,127,.1);cursor:pointer;user-select:none}
tbody tr{cursor:pointer}tbody tr:hover{background:rgba(11,92,173,.1)}
td.n{text-align:right;font-variant-numeric:tabular-nums}
#tblbox{max-height:55vh;overflow:auto;border-radius:10px}#tblbox thead th{position:sticky;top:0;z-index:1;background:var(--card)}
tbody tr.sel{background:rgba(255,212,0,.22)}tbody tr.sel td:first-child{box-shadow:inset 4px 0 0 #ffd400}
@keyframes rowflash{0%,40%,80%{background:rgba(255,212,0,.65)}20%,60%,100%{background:rgba(255,212,0,.22)}}tbody tr.flash{animation:rowflash 1.6s ease}
#method table{display:block;overflow-x:auto}#method td,#method th{white-space:normal}
.tscroll{overflow-x:auto}
.tsearch{display:flex;gap:6px;align-items:center;margin:6px 0 8px;max-width:420px}
.tsearch input{flex:1;font:inherit;border:1px solid var(--line);border-radius:7px;background:var(--card);color:var(--ink);padding:5px 9px}
.tsearch input:focus{outline:2px solid var(--accent);outline-offset:0}
.tsearch button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:7px;padding:4px 9px;cursor:pointer}
.pager{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:8px 0 4px;font-size:.88rem;color:var(--mute)}
.pager button{font:inherit;font-weight:600;min-width:34px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:7px;padding:3px 9px;cursor:pointer}
.pager button:disabled{opacity:.4;cursor:default}.pager button:not(:disabled):hover{border-color:var(--accent);color:var(--accent)}
.pager .pinfo{margin:0 4px;font-variant-numeric:tabular-nums}.pager label{margin-left:auto;display:inline-flex;gap:6px;align-items:center}
.pager select{font:inherit;border:1px solid var(--line);border-radius:7px;background:var(--card);color:var(--ink);padding:2px 6px}
.conf-high{color:#1a7f37;font-weight:600}.conf-medium{color:#9a6700;font-weight:600}.conf-low{color:#b42318;font-weight:600}
.pop{font-size:.85rem;min-width:230px;color:#222}
.pop h4{margin:0 0 4px;font-size:.95rem}
.pop .what{margin:4px 0 6px;font-size:.88rem}
.pop .pair{display:flex;gap:6px;margin:6px 0}
.pop canvas{width:112px;height:112px;border:1px solid #888;border-radius:4px;background:#ccc}
.pop .cap{font-size:.72rem;color:#555;text-align:center}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#fff;color:#222}
.pop table{border:0;font-size:.8rem;background:none;color:#222}.pop td,.pop th{padding:1px 6px;font-size:.8rem;border:0;background:none;cursor:default}
.acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
.act{font:inherit;font-weight:600;border:1px solid var(--accent);background:var(--card);color:var(--accent);border-radius:8px;padding:5px 12px;cursor:pointer}
.act:hover{background:var(--accent);color:#fff}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
@media print{.tsearch,.pager,.acts,.toolbar,#tl,#swipe,#tlhint,#banner,.leaflet-control-zoom{display:none!important}#tblbox{max-height:none;overflow:visible}body{background:#fff;color:#000}.card,details,table{background:#fff}#map,#map3d{height:60vh;break-inside:avoid}h2{break-after:avoid}}
.lang button{border:0;background:var(--card);color:var(--ink);padding:5px 11px;cursor:pointer;font:inherit;font-weight:600}
.lang button[aria-pressed=true]{background:var(--accent);color:#fff}
details{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 14px;margin:10px 0}
summary{cursor:pointer;font-weight:600}
code,pre{font-family:ui-monospace,Consolas,monospace;font-size:.85em}
pre{background:rgba(127,127,127,.12);padding:10px;border-radius:8px;overflow:auto}
footer{margin:24px 0 8px;color:var(--mute);font-size:.82rem}
.small{font-size:.85rem;color:var(--mute)}
@media (max-width:640px){#map,#map3d{height:56vh}}
</style>
</head>
<body>
<div class="wrap">
<div class="top">
  <div><h1 id="h-title"></h1><p class="sub" id="h-sub"></p></div>
  <div class="acts"><button id="b-xlsx" class="act"></button><button id="b-print" class="act"></button><div class="lang" role="group" aria-label="Language"><button data-l="tr">TR</button><button data-l="en">EN</button></div></div>
</div>
<div class="cards" id="cards"></div>
<div id="warnings"></div>

<div class="toolbar">
  <div class="seg" id="modes" role="group">
    <button data-m="swipe" aria-pressed="true"></button>
    <button data-m="before" aria-pressed="false"></button>
    <button data-m="after" aria-pressed="false"></button>
    <button data-m="changes" aria-pressed="false"></button>
    <button data-m="timeline" aria-pressed="false"></button>
  </div>
  <div class="seg" id="views" role="group"><button data-v="2d" aria-pressed="true">2D</button><button data-v="3d" aria-pressed="false">3D</button></div>
  <label class="tg"><span id="t-base-l"></span> <select id="t-base"><option value="none"></option><option value="relief"></option><option value="osm"></option><option value="topo"></option></select></label>
  <label class="tg"><span id="t-op-l"></span> <input type="range" id="t-op" min="0" max="100" value="100" style="width:90px"></label>
  <label class="tg" id="exag-wrap" style="display:none"><span id="t-exag-l"></span> <select id="t-exag"><option value="1">×1</option><option value="1.5" selected>×1.5</option><option value="2">×2</option><option value="3">×3</option><option value="5">×5</option></select></label>
  <label class="tg"><input type="checkbox" id="t-outline" checked> <span id="t-outline-l"></span></label>
  <label class="tg"><input type="checkbox" id="t-pulse" checked> <span id="t-pulse-l"></span></label>
</div>
<div id="tl">
  <button id="tl-play"></button>
  <span id="tl-date"></span>
  <div class="rwrap"><input type="range" id="tl-range" min="0" max="0" value="0" step="1"><div id="ticks"></div></div>
  <span id="tl-meta"></span>
</div>
<div id="mapbox">
  <div id="map"></div>
  <div id="map3d"></div>
  <div class="lab l" id="lab-l"></div><div class="lab r" id="lab-r"></div>
  <div id="tlhint"></div>
  <div id="swipe" role="slider" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50" tabindex="0"><div class="grab"></div><div class="bar"></div><div class="knob">&#8596;</div><div id="knobdate"><span class="b" id="kd-b"></span><span class="a" id="kd-a"></span></div></div>
  <div id="banner"></div>
</div>
<div class="legend" id="legend"></div>
<p class="legend2" id="legend2"></p>

<h2 id="h-changes"></h2>
<p class="small" id="tbl-note"></p>
<div class="tsearch"><input type="search" id="tbl-q" autocomplete="off"><button id="tbl-qx" type="button">✕</button></div>
<div class="tscroll" id="tblbox"><table id="tbl"><thead></thead><tbody></tbody></table></div>
<div class="pager" id="tbl-pager"></div>

<h2 id="h-method"></h2>
<div id="method"></div>

<details><summary><span id="s-scenes"></span> (<span id="nscenes"></span>)</summary><div class="tsearch"><input type="search" id="sc-q" autocomplete="off"><button id="sc-qx" type="button">✕</button></div><div class="tscroll"><table id="scenes"><thead></thead><tbody></tbody></table></div><div class="pager" id="sc-pager"></div></details>
<details><summary id="s-thr"></summary><div id="thr"></div></details>

<footer id="foot"></footer>
</div>

<script type="application/json" id="data">{{DATA_JSON}}</script>
<script>{{LEAFLET_JS}}</script>

  gl.uniform4fv(U('rR'),rectOf(TER.bounds)); gl.uniform4fv(U('rC'),rectOf(B));

    return [(c[0]/c[3]*0.5+0.5)*ov.width, (0.5-c[1]/c[3]*0.5)*ov.height, c[3]]; }
  // a ring on the ground: a circle of growing radius (metres) around the change, following the terrain

  let hlId=null, hlTill=0;
  const feats=D.geojson.features.map(f=>({f, X:mxOf(f.properties.centroid_lon), Y:myOf(f.properties.centroid_lat), r:Math.sqrt(f.properties.area_ha*1e4)/2/coslat}));
  const pulseSet=new Set(pulseFeats.map(f=>f.properties.id));
  let ph=0, last=0, chgOn=true, hover=null;
  function draw(ts){
    const dt=Math.min(0.1,(ts-(last||ts))/1000); last=ts;
    if(cam.auto){cam.yaw+=dt*0.09;dirty=true;}
    const pulsing=pulseActive();

      matrices(); gl.viewport(0,0,cv.width,cv.height); gl.clearColor(0.81,0.84,0.87,1); gl.enable(gl.DEPTH_TEST); gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
      gl.uniformMatrix4fv(U('uM'),false,M); gl.uniform1f(U('sI'),sI); gl.uniform1f(U('sC'),chgOn?1:0); gl.uniform1f(U('uSplit'),split>=0?split*cv.width:-1);

  function showPop(f,x,y){ pop.innerHTML='<div style="text-align:right;margin:-4px -4px 0 0"><button aria-label="close" style="border:0;background:none;font-size:18px;cursor:pointer">×</button></div>'+popupHtml(f.properties,false);

function current3dImage(){

function sync3dImage(){ if (!m3) return; const [u,bb,show]=current3dImage(); m3.setImage(u,bb,show);

function setView(v){
  if (v==='3d' && !TER) { flash(L_().no3d); return; }
  view=v; document.querySelectorAll('#views button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===v));
  $('#exag-wrap').style.display = v==='3d' ? '' : 'none';
  if (v==='3d') {
    $('#map').style.display='none'; $('#map3d').style.display='block';
    if (!m3) { try { m3 = build3d(); } catch(e) { m3=null; $('#map3d').textContent=L_().no3d; } }
    if (m3) { m3.setBase(); m3.setImageOpacity(1); m3.start(); setMode(mode); }
  } else { $('#map3d').style.display='none'; $('#map').style.display='block'; map.invalidateSize(); setMode(mode); updateDotsSoon(); }
  $('#t-base').closest('label').style.display = $('#t-op').closest('label').style.display = v==='3d' ? 'none' : '';
}
document.querySelectorAll('#views button').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.v)));
$('#t-exag').addEventListener('change',e=>{ if (m3) m3.setExag(+e.target.value); });
if (!TER) { const b=document.querySelector('#views button[data-v="3d"]'); b.disabled=true; }

const HASH = new URLSearchParams(location.hash.slice(1));
if (['none','relief','osm','topo'].includes(HASH.get('base')) && !($('#t-base').querySelector('option[value="'+HASH.get('base')+'"]')||{}).disabled) { $('#t-base').value = HASH.get('base'); setBase(HASH.get('base')); }
if (TL.length>1) ratio = Math.max(0.02, Math.min(0.98, (tlIndex+0.5)/(TL.length-1)));  // the swipe line starts between the last "before" and the first "after" pass
setRatio(ratio);
setMode('swipe');
renderTexts();
if (HASH.get('view')==='3d' && TER) setView('3d');
})();
