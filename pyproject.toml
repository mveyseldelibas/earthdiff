[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "earthdiff"
version = "0.2.1"
description = "What changed here? Explainable change reports from free Sentinel-2 imagery, for you and for AI assistants (MCP server included). No account, no API key."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Mehmet Veysel Delibaş" }]
keywords = ["mcp", "model-context-protocol", "claude", "cursor", "sentinel-2", "change-detection", "remote-sensing", "gis", "deforestation", "wildfire", "stac", "ndvi", "open-data"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "rasterio>=1.3.9",
  "shapely>=2.0",
  "pyproj>=3.6",
  "pillow>=10.0",
  "pystac-client>=0.8",
]

[project.optional-dependencies]
planetary-computer = ["planetary-computer>=1.0"]
# MCP server for AI assistants (stdio): uvx --from "earthdiff[mcp]" earthdiff-mcp
mcp = ["mcp>=1.12,<3", "httpx>=0.27", "anyio>=4.0"]
dev = ["pytest>=8", "mcp>=1.12,<3", "httpx>=0.27", "anyio>=4.0"]

[project.scripts]
earthdiff = "earthdiff.cli:main"
earthdiff-mcp = "earthdiff.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/earthdiff"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "CHANGELOG.md", "CONTRIBUTING.md"]

[tool.pytest.ini_options]
markers = ["network: tests that need internet access (deselect with -m 'not network')"]
addopts = "-m \"not network\""
testpaths = ["tests"]

[project.urls]
Homepage = "https://github.com/mveyseldelibas/earthdiff"
Issues = "https://github.com/mveyseldelibas/earthdiff/issues"
Changelog = "https://github.com/mveyseldelibas/earthdiff/blob/main/CHANGELOG.md"
